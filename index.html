<!-- LOGIN AND ACCOUNT SYSTEM: independent of Three.js -->

<script>
(() => {
    "use strict";

    const $ = id => document.getElementById(id);

    let registerMode = false;
    let currentUser = null;

    function message(text, success = false) {
        $("loginMessage").textContent = text;
        $("loginMessage").style.color = success ? "#8dffb0" : "#ffaaaa";
    }

    function getAccounts() {
        try {
            return JSON.parse(localStorage.getItem("rr_accounts") || "{}");
        } catch {
            return {};
        }
    }

    function saveAccounts(accounts) {
        localStorage.setItem("rr_accounts", JSON.stringify(accounts));
    }

    function setMode(register) {
        registerMode = register;
        $("loginButton").textContent = register ? "KONTO ERSTELLEN" : "ANMELDEN";
        $("switchMode").textContent = register
            ? "Du hast schon ein Konto? Anmelden"
            : "Noch kein Konto? Registrieren";
        $("password").autocomplete = register ? "new-password" : "current-password";
        message("");
    }

    $("switchMode").addEventListener("click", () => {
        setMode(!registerMode);
    });

    async function hashPassword(password) {
        if (!crypto.subtle) {
            throw new Error("Sichere Passwortfunktion ist in diesem Browser nicht verfügbar. Öffne die Seite in Safari oder Chrome.");
        }

        const data = new TextEncoder().encode(password);
        const hash = await crypto.subtle.digest("SHA-256", data);

        return Array.from(new Uint8Array(hash))
            .map(b => b.toString(16).padStart(2, "0"))
            .join("");
    }

    async function login() {
        const username = $("username").value.trim();
        const password = $("password").value;

        message("");

        if (!username || !password) {
            message("Bitte Spielername und Passwort eingeben.");
            return;
        }

        if (username.length < 3) {
            message("Dein Spielername muss mindestens 3 Zeichen haben.");
            return;
        }

        if (password.length < 4) {
            message("Dein Passwort muss mindestens 4 Zeichen haben.");
            return;
        }

        if (username.length > 20) {
            message("Der Spielername darf höchstens 20 Zeichen haben.");
            return;
        }

        try {
            const accounts = getAccounts();
            const key = username.toLowerCase();
            const passwordHash = await hashPassword(password);

            if (registerMode) {
                if (accounts[key]) {
                    message("Dieser Spielername ist bereits vergeben.");
                    return;
                }

                accounts[key] = {
                    username,
                    passwordHash,
                    coins: 0,
                    inventory: [],
                    equipped: {},
                    created: Date.now()
                };

                saveAccounts(accounts);
                message("Konto erfolgreich erstellt!", true);
            } else {
                const account = accounts[key];

                if (!account || account.passwordHash !== passwordHash) {
                    message("Spielername oder Passwort ist falsch.");
                    return;
                }
            }

            currentUser = username;
            localStorage.setItem("rr_session", username);

            window.startGame(username);

        } catch (error) {
            message(error.message || "Ein Fehler ist aufgetreten.");
        }
    }

    $("loginButton").addEventListener("click", login);

    $("password").addEventListener("keydown", event => {
        if (event.key === "Enter") login();
    });

    $("username").addEventListener("keydown", event => {
        if (event.key === "Enter") $("password").focus();
    });

    window.startGame = function(username) {
        $("menu").classList.add("hidden");
        $("game").classList.remove("hidden");
        $("hud").classList.remove("hidden");
        $("playerLabel").textContent = username;
        window.dispatchEvent(new CustomEvent("rr-start-game", {
            detail: { username }
        }));
    };

    window.returnToMenu = function() {
        $("menu").classList.remove("hidden");
        $("game").classList.add("hidden");
        $("hud").classList.add("hidden");
        $("shopPanel").classList.add("hidden");
        $("password").value = "";
        message("");
    };

    $("exitButton").addEventListener("click", window.returnToMenu);

    $("fullscreenButton").addEventListener("click", async () => {
        try {
            if (!document.fullscreenElement) {
                await document.documentElement.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        } catch {
            message("Vollbild wird von diesem Browser nicht unterstützt.");
        }
    });

    // Inputs are intentionally not disabled or covered by the game canvas.
    $("username").disabled = false;
    $("password").disabled = false;

    setMode(false);
})();
</script>

<!-- GAME ENGINE: loaded separately -->

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const $ = id => document.getElementById(id);

let scene;
let camera;
let renderer;
let player;
let worldReady = false;
let animationStarted = false;

let yaw = 0;
let pitch = 0;
let verticalVelocity = 0;
let onGround = true;

const keys = {};
const joystick = { x: 0, y: 0 };
let coins = 0;
let lastCoinTime = Date.now();

const ownedItems = new Set();
const items = [
    { id: "blue", name: "Blauer Anzug", price: 10, type: "outfit" },
    { id: "red", name: "Roter Anzug", price: 15, type: "outfit" },
    { id: "gold", name: "Goldener Hut", price: 20, type: "hat" },
    { id: "green", name: "Grüner Hut", price: 12, type: "hat" },
    { id: "purple", name: "Lila Skin", price: 25, type: "skin" }
];

function notify(text) {
    const toast = $("toast");
    toast.textContent = text;
    toast.style.display = "block";
    clearTimeout(notify.timer);
    notify.timer = setTimeout(() => {
        toast.style.display = "none";
    }, 2500);
}

function accountData() {
    const username = localStorage.getItem("rr_session");
    if (!username) return null;

    const accounts = JSON.parse(localStorage.getItem("rr_accounts") || "{}");
    return accounts[username.toLowerCase()] || null;
}

function saveAccountData() {
    const username = localStorage.getItem("rr_session");
    if (!username) return;

    const accounts = JSON.parse(localStorage.getItem("rr_accounts") || "{}");
    const account = accounts[username.toLowerCase()];
    if (!account) return;

    account.coins = coins;
    account.inventory = [...ownedItems];
    localStorage.setItem("rr_accounts", JSON.stringify(accounts));
}

function loadAccountData() {
    const account = accountData();
    coins = account?.coins || 0;

    ownedItems.clear();
    for (const item of account?.inventory || []) {
        ownedItems.add(item);
    }

    updateCoins();
}

function updateCoins() {
    $("coinCount").textContent = coins;
    $("shopCoins").textContent = coins;
}

function addCoins(amount) {
    coins += amount;
    updateCoins();
    saveAccountData();
    notify("+" + amount + " Münzen erhalten!");
}

function createWorld() {
    if (worldReady) return;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x82d5ff);
    scene.fog = new THREE.Fog(0x82d5ff, 30, 100);

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        500
    );

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;

    $("game").appendChild(renderer.domElement);

    const ambient = new THREE.HemisphereLight(0xffffff, 0x667788, 2);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 2);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    scene.add(sun);

    // Ground
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0x58bb68 })
    );

    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Main plaza
    const plaza = new THREE.Mesh(
        new THREE.CylinderGeometry(12, 12, 0.3, 48),
        new THREE.MeshStandardMaterial({ color: 0x9ca9b7 })
    );

    plaza.position.y = 0.15;
    scene.add(plaza);

    // Buildings
    createBuilding(-18, 0, -12, 10, 9, 9, 0x5469b5);
    createBuilding(18, 0, -12, 10, 9, 9, 0x9a5db8);
    createBuilding(-18, 0, 13, 10, 9, 9, 0xe5a84f);
    createBuilding(18, 0, 13, 10, 9, 9, 0x4ba7a1);

    // Trees
    for (let i = 0; i < 25; i++) {
        const x = Math.random() * 70 - 35;
        const z = Math.random() * 70 - 35;

        if (Math.abs(x) < 14 && Math.abs(z) < 14) continue;
        createTree(x, z);
    }

    // Player
    player = new THREE.Group();

    const bodyMaterial = new THREE.MeshStandardMaterial({
        color: 0x22bfe8,
        roughness: 0.7
    });

    const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.42, 0.7, 5, 10),
        bodyMaterial
    );

    body.position.y = 1.1;
    body.castShadow = true;
    player.add(body);

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.36, 20, 20),
        new THREE.MeshStandardMaterial({ color: 0xffd1a1 })
    );

    head.position.y = 1.9;
    head.castShadow = true;
    player.add(head);

    const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x111111 });

    for (const x of [-0.12, 0.12]) {
        const eye = new THREE.Mesh(
            new THREE.SphereGeometry(0.035, 8, 8),
            eyeMaterial
        );
        eye.position.set(x, 1.95, -0.32);
        player.add(eye);
    }

    player.position.set(0, 0, 4);
    scene.add(player);

    // NPCs
    createNPC(-5, 0, -5, "Alex");
    createNPC(6, 0, -6, "Mia");
    createNPC(0, 0, -12, "Leo");

    camera.position.set(0, 3, 9);
    worldReady = true;

    setupControls();
    window.addEventListener("resize", resize);
}

function createBuilding(x, y, z, width, height, depth, color) {
    const building = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        new THREE.MeshStandardMaterial({ color })
    );

    building.position.set(x, height / 2, z);
    building.castShadow = true;
    building.receiveShadow = true;
    scene.add(building);

    const roof = new THREE.Mesh(
        new THREE.ConeGeometry(width * 0.75, 3, 4),
        new THREE.MeshStandardMaterial({ color: 0x30364c })
    );

    roof.position.set(x, height + 1.5, z);
    roof.rotation.y = Math.PI / 4;
    scene.add(roof);

    const door = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 3, 0.15),
        new THREE.MeshStandardMaterial({ color: 0x272b39 })
    );

    door.position.set(x, 1.5, z + depth / 2 + 0.09);
    scene.add(door);
}

function createTree(x, z) {
    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.3, 2, 8),
        new THREE.MeshStandardMaterial({ color: 0x79502c })
    );

    trunk.position.set(x, 1, z);
    scene.add(trunk);

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(1.2, 10, 10),
        new THREE.MeshStandardMaterial({ color: 0x168c4b })
    );

    leaves.position.set(x, 2.6, z);
    scene.add(leaves);
}

function createNPC(x, y, z, name) {
    const npc = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.4, 0.65, 5, 10),
        new THREE.MeshStandardMaterial({
            color: Math.random() * 0xffffff
        })
    );

    body.position.y = 1.05;
    npc.add(body);

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.34, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xffd2a6 })
    );

    head.position.y = 1.85;
    npc.add(head);

    npc.position.set(x, y, z);
    npc.userData.startX = x;
    npc.userData.startZ = z;
    npc.userData.phase = Math.random() * 6;
    npc.userData.name = name;

    scene.add(npc);
    npcs.push(npc);
}

const npcs = [];

function setupControls() {
    window.addEventListener("keydown", event => {
        keys[event.code] = true;

        if (["Space", "ArrowUp", "ArrowDown"].includes(event.code)) {
            event.preventDefault();
        }

        if (event.code === "Space") jump();
    });

    window.addEventListener("keyup", event => {
        keys[event.code] = false;
    });

    const joystickArea = $("joystickArea");
    const knob = $("joystickKnob");

    let joystickPointer = null;

    joystickArea.addEventListener("pointerdown", event => {
        joystickPointer = event.pointerId;
        joystickArea.setPointerCapture(event.pointerId);
        moveJoystick(event);
    });

    joystickArea.addEventListener("pointermove", event => {
        if (event.pointerId === joystickPointer) moveJoystick(event);
    });

    function resetJoystick() {
        joystickPointer = null;
        joystick.x = 0;
        joystick.y = 0;
        knob.style.transform = "translate(0px, 0px)";
    }

    joystickArea.addEventListener("pointerup", resetJoystick);
    joystickArea.addEventListener("pointercancel", resetJoystick);

    function moveJoystick(event) {
        const rect = joystickArea.getBoundingClientRect();
        let x = event.clientX - (rect.left + rect.width / 2);
        let y = event.clientY - (rect.top + rect.height / 2);

        const distance = Math.hypot(x, y);
        const max = 40;

        if (distance > max) {
            x = x / distance * max;
            y = y / distance * max;
        }

        joystick.x = x / max;
        joystick.y = y / max;

        knob.style.transform = `translate(${x}px, ${y}px)`;
    }

    let lookPointer = null;
    let previousX = 0;
    let previousY = 0;

    renderer.domElement.addEventListener("pointerdown", event => {
        if (event.clientX < window.innerWidth * 0.42) return;

        lookPointer = event.pointerId;
        previousX = event.clientX;
        previousY = event.clientY;

        renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", event => {
        if (event.pointerId !== lookPointer) return;

        const dx = event.clientX - previousX;
        const dy = event.clientY - previousY;

        yaw -= dx * 0.006;
        pitch -= dy * 0.004;

        pitch = Math.max(-0.65, Math.min(0.65, pitch));

        previousX = event.clientX;
        previousY = event.clientY;
    });

    renderer.domElement.addEventListener("pointerup", () => {
        lookPointer = null;
    });

    renderer.domElement.addEventListener("pointercancel", () => {
        lookPointer = null;
    });

    $("jumpButton").addEventListener("pointerdown", event => {
        event.preventDefault();
        jump();
    });

    $("sprintButton").addEventListener("pointerdown", () => {
        keys.ShiftLeft = true;
    });

    $("sprintButton").addEventListener("pointerup", () => {
        keys.ShiftLeft = false;
    });

    $("sprintButton").addEventListener("pointercancel", () => {
        keys.ShiftLeft = false;
    });

    $("shopButton").addEventListener("click", openShop);
    $("closeShop").addEventListener("click", closeShop);
}

function jump() {
    if (!onGround) return;

    verticalVelocity = 7;
    onGround = false;
}

function resize() {
    if (!camera || !renderer) return;

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function updatePlayer(delta) {
    if (!player) return;

    let forward = 0;
    let sideways = 0;

    if (keys.KeyW || keys.ArrowUp) forward += 1;
    if (keys.KeyS || keys.ArrowDown) forward -= 1;
    if (keys.KeyA || keys.ArrowLeft) sideways -= 1;
    if (keys.KeyD || keys.ArrowRight) sideways += 1;

    forward += -joystick.y;
    sideways += joystick.x;

    const length = Math.hypot(forward, sideways);

    if (length > 1) {
        forward /= length;
        sideways /= length;
    }

    const sprinting = keys.ShiftLeft || keys.ShiftRight;
    const speed = sprinting ? 10 : 5;

    const moveX = Math.sin(yaw) * forward + Math.cos(yaw) * sideways;
    const moveZ = -Math.cos(yaw) * forward + Math.sin(yaw) * sideways;

    player.position.x += moveX * speed * delta;
    player.position.z += moveZ * speed * delta;

    player.position.x = THREE.MathUtils.clamp(player.position.x, -45, 45);
    player.position.z = THREE.MathUtils.clamp(player.position.z, -45, 45);

    if (length > 0.05) {
        player.rotation.y = Math.atan2(moveX, moveZ);
    }

    verticalVelocity -= 18 * delta;
    player.position.y += verticalVelocity * delta;

    if (player.position.y <= 0) {
        player.position.y = 0;
        verticalVelocity = 0;
        onGround = true;
    }

    const distance = 8;
    const targetX = player.position.x + Math.sin(yaw) * distance;
    const targetZ = player.position.z + Math.cos(yaw) * distance;

    camera.position.x += (targetX - camera.position.x) * Math.min(1, delta * 8);
    camera.position.z += (targetZ - camera.position.z) * Math.min(1, delta * 8);
    camera.position.y += (player.position.y + 3 + pitch * 2 - camera.position.y) * Math.min(1, delta * 8);

    camera.lookAt(
        player.position.x,
        player.position.y + 1.4,
        player.position.z
    );
}

function updateNPCs(time) {
    for (const npc of npcs) {
        const phase = time * 0.0005 + npc.userData.phase;

        npc.position.x = npc.userData.startX + Math.sin(phase) * 2;
        npc.position.z = npc.userData.startZ + Math.cos(phase * 0.7) * 2;
    }
}

let lastNPCMessage = 0;

function npcTalk() {
    const now = Date.now();
    if (now - lastNPCMessage < 12000) return;

    lastNPCMessage = now;

    const phrases = [
        "Willkommen in unserer Welt!",
        "Schön, dass du da bist!",
        "Hast du schon den Shop besucht?",
        "Hier gibt es viel zu entdecken!",
        "Viel Spaß beim Spielen!"
    ];

    const phrase = phrases[Math.floor(Math.random() * phrases.length)];
    notify("NPC: " + phrase);

    if ("speechSynthesis" in window) {
        const speech = new SpeechSynthesisUtterance(phrase);
        speech.lang = "de-DE";
        speech.rate = 1;
        speechSynthesis.speak(speech);
    }
}

function openShop() {
    $("shopPanel").classList.remove("hidden");
    renderShop();
}

function closeShop() {
    $("shopPanel").classList.add("hidden");
}

function renderShop() {
    const container = $("shopItems");
    container.innerHTML = "";

    for (const item of items) {
        const owned = ownedItems.has(item.id);

        const row = document.createElement("div");
        row.className = "shopItem";

        const name = document.createElement("span");
        name.textContent = item.name + " – " + item.price + " Münzen";

        const button = document.createElement("button");
        button.textContent = owned ? "Besitzt du" : "Kaufen";
        button.disabled = owned;

        button.addEventListener("click", () => {
            if (ownedItems.has(item.id)) return;

            if (coins < item.price) {
                notify("Du hast nicht genug Münzen!");
                return;
            }

            coins -= item.price;
            ownedItems.add(item.id);
            updateCoins();
            saveAccountData();
            renderShop();
            notify(item.name + " gekauft!");
        });

        row.append(name, button);
        container.appendChild(row);
    }

    $("shopCoins").textContent = coins;
}

function gameLoop(time) {
    requestAnimationFrame(gameLoop);

    if (!worldReady) return;

    const delta = Math.min(clock.getDelta(), 0.05);

    updatePlayer(delta);
    updateNPCs(time);

    if (renderer && scene && camera) {
        renderer.render(scene, camera);
    }

    if (Date.now() - lastCoinTime >= 5 * 60 * 1000) {
        lastCoinTime = Date.now();
        addCoins(2);
    }

    if (Math.random() < 0.0008) {
        npcTalk();
    }
}

const clock = new THREE.Clock();

function startWorld() {
    if (!worldReady) {
        createWorld();
    }

    loadAccountData();

    if (!animationStarted) {
        animationStarted = true;
        requestAnimationFrame(gameLoop);
    }

    lastCoinTime = Date.now();
}

window.addEventListener("rr-start-game", () => {
    try {
        startWorld();
    } catch (error) {
        console.error(error);
        notify("Fehler beim Starten der Spielwelt. Bitte lade die Seite neu.");
    }
});
</script>

</body>
